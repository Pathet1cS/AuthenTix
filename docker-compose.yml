version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: authentix-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - authentix-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: authentix-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env.docker
    environment:
      - MONGO_URI=mongodb://mongodb:27017/authentix
      - PORT=3001
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - authentix-network

volumes:
  mongo-data:
    driver: local

networks:
  authentix-network:
    driver: bridge
